<!DOCTYPE html>
<html>
  <head>
  </head>
  <body>
    <div class="tabs">
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <div id="chat-tab" class="tab-content active">
      <textarea id="question" placeholder="Ask something..."></textarea>
      <button id="askBtn">Submit</button>
      <div id="answer"></div>
    </div>

    <div id="settings-tab" class="tab-content">
      <label class="label">API Key</label>
      <div class="api-key-row">
        <input type="password" id="apiKey" placeholder="Enter your API key" />
        <button id="toggleKey" class="icon-btn" title="Show/Hide">&#128065;</button>
      </div>
      <button id="saveKey" class="secondary-btn">Save Key</button>
      <div id="keyStatus" class="status"></div>

      <label class="label">Ingest PDF</label>
      <div id="dropZone" class="drop-zone">
        <p>Drop PDF here or click to browse</p>
        <input type="file" id="pdfInput" accept=".pdf" hidden />
      </div>
      <div id="uploadStatus" class="status"></div>

      <label class="label">Ingested Data</label>
      <div id="docCount" class="doc-count">Loading...</div>
      <button id="clearBtn" class="danger-btn">Clear All Data</button>
      <div id="clearStatus" class="status"></div>
    </div>

    <script src="popup.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 380px;
        min-height: 500px;
        background: #16213e;
        color: #e0e0e0;
        padding: 16px;
        border-radius: 12px;
        overflow-x: hidden;
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 16px;
        background: rgba(255,255,255,0.06);
        border-radius: 8px;
        padding: 4px;
      }
      .tab {
        flex: 1;
        background: transparent;
        color: rgba(255,255,255,0.5);
        border: none;
        height: 36px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13px;
        transition: all 0.2s;
        margin: 0;
        padding: 0;
        box-shadow: none;
        letter-spacing: 0;
      }
      .tab.active {
        background: #3b82f6;
        color: #ffffff;
      }
      .tab:hover:not(.active) {
        color: rgba(255,255,255,0.8);
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      /* Chat tab */
      textarea {
        width: 100%;
        height: 80px;
        border-radius: 8px;
        background: rgba(255,255,255,0.08);
        color: #ffffff;
        padding: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        resize: none;
        font-size: 14px;
        line-height: 1.4;
        font-family: inherit;
      }
      textarea::placeholder {
        color: rgba(255,255,255,0.4);
      }
      textarea:focus {
        outline: none;
        border-color: rgba(59,130,246,0.6);
        background: rgba(255,255,255,0.1);
      }
      button {
        display: block;
        width: 100%;
        height: 40px;
        border-radius: 8px;
        background: #3b82f6;
        color: #ffffff;
        border: none;
        padding: 0 16px;
        margin: 10px 0 0;
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 600;
        font-size: 14px;
      }
      button:hover {
        background: #2563eb;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
      #answer {
        margin-top: 14px;
        padding: 16px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        min-height: 100px;
        max-height: 300px;
        overflow-y: auto;
        font-size: 14px;
        line-height: 1.6;
        color: #e0e0e0;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      #answer:empty {
        display: none;
      }

      /* Settings tab */
      .label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255,255,255,0.6);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        margin-top: 16px;
      }
      .label:first-child {
        margin-top: 0;
      }
      .api-key-row {
        display: flex;
        gap: 6px;
      }
      .api-key-row input {
        flex: 1;
        height: 38px;
        border-radius: 8px;
        background: rgba(255,255,255,0.08);
        color: #ffffff;
        padding: 0 12px;
        border: 1px solid rgba(255,255,255,0.15);
        font-size: 13px;
        font-family: inherit;
      }
      .api-key-row input:focus {
        outline: none;
        border-color: rgba(59,130,246,0.6);
      }
      .api-key-row input::placeholder {
        color: rgba(255,255,255,0.3);
      }
      .icon-btn {
        width: 38px;
        min-width: 38px;
        height: 38px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        margin: 0;
      }
      .secondary-btn {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.15);
        height: 36px;
        font-size: 13px;
        margin-top: 8px;
      }
      .secondary-btn:hover {
        background: rgba(255,255,255,0.18);
      }
      .danger-btn {
        background: rgba(239,68,68,0.15);
        border: 1px solid rgba(239,68,68,0.3);
        height: 36px;
        font-size: 13px;
        margin-top: 8px;
      }
      .danger-btn:hover {
        background: rgba(239,68,68,0.25);
      }
      .drop-zone {
        border: 2px dashed rgba(255,255,255,0.15);
        border-radius: 10px;
        padding: 24px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      .drop-zone:hover, .drop-zone.dragover {
        border-color: #3b82f6;
        background: rgba(59,130,246,0.08);
      }
      .drop-zone p {
        font-size: 13px;
        color: rgba(255,255,255,0.4);
      }
      .doc-count {
        font-size: 13px;
        color: rgba(255,255,255,0.5);
        padding: 10px 0;
      }
      .status {
        font-size: 12px;
        margin-top: 6px;
        min-height: 18px;
      }
      .status.success {
        color: #4ade80;
      }
      .status.error {
        color: #f87171;
      }
      .status.loading {
        color: rgba(255,255,255,0.4);
      }
    </style>
  </body>
</html>
